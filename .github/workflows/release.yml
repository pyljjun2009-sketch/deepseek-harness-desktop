name: release-windows

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # npm 11 can skip Electron's lifecycle downloader; electronDist requires
      # the unpacked runtime to exist before electron-builder starts.
      - run: node node_modules/electron/install.js
      - run: npm run verify
      - run: npx electron-builder --win nsis --x64 --publish never
        timeout-minutes: 30
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
      - run: npm run smoke:packaged
      - run: npm run stress:packaged
        env:
          DSH_STRESS_ROUNDS: "2"
          DSH_STRESS_CONCURRENCY: "30"
          DSH_SUPERVISOR_ROUNDS: "1"
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          generate_release_notes: true
          files: release/*
