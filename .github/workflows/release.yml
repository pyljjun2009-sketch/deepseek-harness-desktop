name: release-windows

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # npm 11 can skip Electron's lifecycle downloader; electronDist requires
      # the unpacked runtime to exist before electron-builder starts.
      - run: node node_modules/electron/install.js
      - name: Require the official distribution version for a release tag
        run: >-
          node -e "const v=require('./official.lock.json').distributionVersion;
          if(process.env.GITHUB_REF_TYPE==='tag' && process.env.GITHUB_REF_NAME!=='desktop-v'+v)
          throw new Error('Release tag does not match official.lock.json');"
      - run: npm run verify
      - name: Build the frozen official desktop (not the legacy supervisor)
        run: npm run dist:official
        timeout-minutes: 90
        env:
          DSH_OFFICIAL_SOURCE: C:\DSHB\harness-020rc2
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
      - name: Real native installer guard and directory transaction tests
        run: npm run test:installer
        env:
          DSH_INSTALLER_NATIVE_TEST: "1"
      - name: Seal the final NSIS copy and installer identity
        run: npm run dist:official:repackage
        timeout-minutes: 30
      - name: Verify the real frozen shell and Host port policy
        run: npm run test:shell
        env:
          DSH_SHELL_REAL_TEST: "1"
          DSH_OFFICIAL_SOURCE: C:\DSHB\harness-020rc2
      - name: Qualify three real crashes with the production watchdog
        run: npm run qualify:recovery
        timeout-minutes: 30
      - name: Qualify full isolated install, replacement and uninstall
        run: npm run qualify:installer
        timeout-minutes: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-desktop-qualification
          path: .official-build/**/report.json
          if-no-files-found: ignore
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          generate_release_notes: true
          files: |
            release/DeepSeek-Harness-Desktop-*.exe
            release/DeepSeek-Harness-Desktop-*.exe.blockmap
            release/latest.yml
